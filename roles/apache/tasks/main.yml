- name: install httpd
  ansible.builtin.dnf:
    name: httpd
    state: present
- name: Enable httpd and firewalld
  ansible.builtin.service:
    name: httpd
    enabled: true
    state: started
- name: Enable httpd and firewalld
  ansible.builtin.service:
    name: firewalld
    enabled: true
    state: started    
- name: allow httpd from firewalld
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled
- name: Copy file from /var/ww/html/index.html to index.html.j2 
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    
