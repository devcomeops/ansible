- name: Configure cron job
  hosts: all
  become: true
  tasks:
    - name: Ensure a job that runs at 2 and 5 exists. Creates an entry like "0 5,2 * * ls -alh > /dev/null"
      ansible.builtin.cron:
        name: EX294 certified
        minute: "*/2"
        user: ansible
        job: 'logger "EX254 is completed and passed"'
