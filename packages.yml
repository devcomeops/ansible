- name: Install php amd mariadb
  hosts: dev,test,prod
  become: true
  tasks:
    - name: install PHP and mariadb
      ansible.builtin.dnf:
        name:
          - php
          - mariadb
        state: present
- name: Install RPM Tools
  hosts: dev
  become: true
  tasks:
    - name: install RPM Tools 
      ansible.builtin.dnf:
        name: "@Development Tools"
        state: present
    - name: update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest              